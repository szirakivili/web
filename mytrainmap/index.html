<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTrainMap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #title {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .leaflet-bottom.leaflet-right {
      margin-bottom: 20px;
      margin-right: 20px;
    }

    /* Jelmagyarázat gomb és panel */
    #legendToggle {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 1100;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background-color 0.2s ease;
    }
    #legendToggle:hover {
      background-color: rgba(240,240,240,1);
    }

    #legend {
      position: absolute;
      bottom: 48px;
      left: 12px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      line-height: 1.4;
      min-width: 230px;
      display: none;
    }

    #legend .item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    #legend .item:last-child {
      margin-bottom: 0;
    }

    #legend .lineWithCircle {
      position: relative;
      width: 40px;
      height: 14px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    #legend .lineWithCircle .line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 2px;
      transform: translateY(-50%);
      background-color: currentColor;
    }

    #legend .lineWithCircle .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background-color: #FFFFFF;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
    }

    /* Színosztályok a jelmagyarázathoz */
    #legend .lineWithCircle.normal { color: #1A237E; }
    #legend .lineWithCircle.narrow { color: #E65100; }
    #legend .lineWithCircle.hev { color: #2E7D32; }
    #legend .lineWithCircle.future { color: #37474F; }
    #legend .lineWithCircle.future .line {
      background: repeating-linear-gradient(
        90deg,
        #37474F,
        #37474F 4px,
        transparent 4px,
        transparent 8px
      );
    }
  </style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F7NERFLG67"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F7NERFLG67');
</script>
<body>
  <div id="title">🚂 MyTrainMap</div>
  <div id="map"></div>

  <button id="legendToggle" aria-expanded="false" aria-controls="legend" title="Jelmagyarázat mutatása">Jelmagyarázat ▲</button>
  <div id="legend" role="region" aria-label="Jelmagyarázat">
    <div class="item">
      <div class="lineWithCircle normal">
        <div class="line"></div>
        <div class="circle"></div>
      </div>
      Normál- / szélesnyomtáv
    </div>
    <div class="item">
      <div class="lineWithCircle narrow">
        <div class="line"></div>
        <div class="circle"></div>
      </div>
      Keskenynyomtáv
    </div>
    <div class="item">
      <div class="lineWithCircle hev">
        <div class="line"></div>
        <div class="circle"></div>
      </div>
      HÉV
    </div>
    <div class="item">
      <div class="lineWithCircle future">
        <div class="line"></div>
        <div class="circle"></div>
      </div>
      Jövőbeni
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <script>
    // Térkép inicializálása
    const map = L.map('map', { zoomControl: false }).setView([47.0, 19.0], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Külön réteg (pane) létrehozása az állomásoknak, hogy a vonalak felett jelenjenek meg
    map.createPane('stationsPane');
    map.getPane('stationsPane').style.zIndex = 650;

    // Kiterjedés kiszámításához gyűjtőcsoport
    const featureGroup = L.featureGroup().addTo(map);

    // Színpaletta
    const COLORS = {
      normal: '#1A237E', // Sötétkék
      narrow: '#E65100', // Narancssárga
      hev: '#2E7D32',    // Zöld
      future: '#37474F'  // Sötétszürke / fekete
    };

    // Stílusok vonalakra és pontokra
    const styleLine = (color) => ({ color, weight: 3.5, opacity: 0.85 });
    const styleDashedLine = { color: COLORS.future, weight: 3, opacity: 0.8, dashArray: '5 5' };

    // Kisebb állomáskörök fehér belsővel a vonalak felett
    const stylePoint = (color) => (feature, latlng) =>
      L.circleMarker(latlng, {
        pane: 'stationsPane',
        radius: 3.5,
        fillColor: '#FFFFFF',
        color: color,
        weight: 2,
        opacity: 1,
        fillOpacity: 1
      });

    // Jövőbeli állomás stílusa
    const styleFuturePoint = (feature, latlng) =>
      L.circleMarker(latlng, {
        pane: 'stationsPane',
        radius: 3.5,
        fillColor: '#FFFFFF',
        color: COLORS.future,
        weight: 2,
        opacity: 1,
        fillOpacity: 1
      });

    let pendingLayers = 0;

    function checkFitBounds() {
      pendingLayers--;
      if (pendingLayers === 0 && featureGroup.getLayers().length > 0) {
        map.fitBounds(featureGroup.getBounds(), { padding: [30, 30] });
      }
    }

    function addLineLayer(file, color) {
      pendingLayers++;
      omnivore.kml(file)
        .on('ready', function () {
          this.setStyle(styleLine(color));
          this.eachLayer(l => {
            if (l.feature?.properties?.name) {
              l.bindTooltip(l.feature.properties.name, { sticky: true });
            }
          });
          featureGroup.addLayer(this);
          checkFitBounds();
        })
        .on('error', checkFitBounds);
    }

    function addStationLayer(file, color) {
      pendingLayers++;
      omnivore.kml(file, null, L.geoJson(null, {
        pointToLayer: stylePoint(color)
      }))
        .on('ready', function () {
          this.eachLayer(l => {
            if (l.feature?.properties?.name) {
              l.bindTooltip(l.feature.properties.name, { sticky: true });
            }
          });
          featureGroup.addLayer(this);
          checkFitBounds();
        })
        .on('error', checkFitBounds);
    }

    function addFutureLayer(file) {
      pendingLayers++;
      omnivore.kml(file, null, L.geoJson(null, {
        style: feature => {
          if (feature.geometry.type === "LineString" || feature.geometry.type === "MultiLineString") {
            return styleDashedLine;
          }
          return {};
        },
        pointToLayer: styleFuturePoint
      }))
        .on('ready', function () {
          this.eachLayer(l => {
            if (l.feature?.properties?.name) {
              l.bindTooltip(l.feature.properties.name, { sticky: true });
            }
          });
          featureGroup.addLayer(this);
          checkFitBounds();
        })
        .on('error', checkFitBounds);
    }

    // Rétegek betöltése
    addLineLayer('normal_vasut.kml', COLORS.normal);
    addStationLayer('normal_allomasok.kml', COLORS.normal);

    addLineLayer('keskeny_vasut.kml', COLORS.narrow);
    addStationLayer('keskeny_allomasok.kml', COLORS.narrow);

    addLineLayer('hev_vasut.kml', COLORS.hev);
    addStationLayer('hev_allomasok.kml', COLORS.hev);

    addFutureLayer('jovo.kml');

    // Jelmagyarázat gomb eseménykezelő
    const legendToggle = document.getElementById('legendToggle');
    const legend = document.getElementById('legend');
    legendToggle.addEventListener('click', () => {
      const isVisible = legend.style.display === 'block';
      legend.style.display = isVisible ? 'none' : 'block';
      legendToggle.setAttribute('aria-expanded', !isVisible);
      legendToggle.textContent = isVisible ? 'Jelmagyarázat ▲' : 'Jelmagyarázat ▼';
    });
  </script>
</body>
</html>
